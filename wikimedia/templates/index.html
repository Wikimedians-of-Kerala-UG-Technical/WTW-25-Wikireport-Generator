<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayalam Movies Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --accent: #f97316;
            --accent-light: #fb923c;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a2847 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: var(--text-primary);
            padding-bottom: 40px;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #0d9488 50%, #14b8a6 100%);
            padding: 60px 0 40px;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(15, 118, 110, 0.3);
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: rgba(249, 115, 22, 0.1);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        .header h1 {
            font-size: 3.5em;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }
        
        .container-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .filter-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 40px;
            margin-bottom: 50px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            overflow-x: auto;
        }
        
        .filter-card:hover {
            border-color: var(--primary-light);
            box-shadow: 0 12px 48px rgba(20, 184, 166, 0.2);
        }
        
        .filter-title {
            font-size: 1.6em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .filter-title i {
            color: var(--primary-light);
            font-size: 1.8em;
        }
        
        .year-slider-group {
            display: grid;
            grid-template-columns: 1fr 1fr 60px 60px;
            gap: 10px;
            align-items: flex-end;
        }
        
        .year-input-group {
            display: flex;
            flex-direction: column;
        }
        
        .year-input-group label {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .year-input-group input,
        .year-input-group select {
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1em;
            background: rgba(30, 41, 59, 0.5);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        
        .year-input-group input:focus,
        .year-input-group select:focus {
            outline: none;
            border-color: var(--primary-light);
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
        }
        
        .btn-filter {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
            color: white;
            padding: 6px 8px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-width: 50px;
        }
        
        .btn-filter:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.5);
        }
        
        .btn-reset {
            background: var(--card-bg);
            color: var(--primary-light);
            padding: 6px 8px;
            border: 2px solid var(--primary-light);
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            font-size: 0.7em;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-width: 50px;
        }
        
        .btn-reset:hover {
            background: var(--primary-light);
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        
        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-light);
            box-shadow: 0 16px 48px rgba(20, 184, 166, 0.2);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
            opacity: 0.08;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover::before {
            opacity: 0.15;
        }
        
        .stat-icon {
            font-size: 2.8em;
            margin-bottom: 20px;
            display: inline-block;
        }
        
        .stat-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .stat-value {
            font-size: 3.2em;
            font-weight: 800;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }
        
        .section {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }
        
        .section-title {
            font-size: 1.9em;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary-light);
        }
        
        .section-title i {
            color: var(--accent);
            font-size: 2em;
        }
        
        .chart-container {
            position: relative;
            height: 380px;
            margin-bottom: 30px;
            background: rgba(20, 184, 166, 0.05);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }
        
        .directors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        
        .director-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(20, 184, 166, 0.25);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .director-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(20, 184, 166, 0.4);
        }
        
        .director-name {
            font-weight: 700;
            font-size: 1em;
        }
        
        .director-count {
            background: rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9em;
            backdrop-filter: blur(10px);
        }
        
        .movies-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .movies-table th {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
            color: white;
            padding: 18px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9em;
        }
        
        .movies-table td {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        
        .movies-table tr:hover {
            background: rgba(20, 184, 166, 0.08);
        }
        
        .year-timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }
        
        .year-badge {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9em;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
            transition: all 0.3s ease;
        }
        
        .year-badge:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
        }
        
        .no-data {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        
        .no-data i {
            font-size: 4em;
            color: var(--primary-light);
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2em;
            }
            
            .year-slider-group {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .directors-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="container-main">
            <div class="header-content">
                <h1>🎬 Malayalam Movies</h1>
                <p>Discover and analyze films by year range with stunning insights</p>
            </div>
        </div>
    </div>

    <div class="container-main">
        <div class="filter-card">
            <div class="filter-title">
                <i class="fas fa-sliders-h"></i> Filter Options
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                <div>
                    <h5 style="color: var(--text-primary); font-weight: 700; margin-bottom: 15px; font-size: 1.1em;">
                        <i class="fas fa-calendar-alt"></i> Filter by Year Range
                    </h5>
                    <div class="year-slider-group">
                        <div class="year-input-group">
                            <label for="startYear">Start Year</label>
                            <input type="number" id="startYear" name="startYear" min="1920">
                        </div>
                        <div class="year-input-group">
                            <label for="endYear">End Year</label>
                            <input type="number" id="endYear" name="endYear" min="1920">
                        </div>
                        <button class="btn-filter" onclick="generateYearReport()">
                            <i class="fas fa-search"></i> Filter
                        </button>
                        <button class="btn-reset" onclick="resetYearFilter()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                </div>

                <div>
                    <h5 style="color: var(--text-primary); font-weight: 700; margin-bottom: 15px; font-size: 1.1em;">
                        <i class="fas fa-film"></i> Filter by Director or Movie
                    </h5>
                    <div class="year-slider-group">
                        <div class="year-input-group">
                            <label for="directorFilter">Director Name</label>
                            <input type="text" id="directorFilter" name="directorFilter" placeholder="Enter director name">
                        </div>
                        <div class="year-input-group">
                            <label for="movieTitleFilter">Movie Title</label>
                            <input type="text" id="movieTitleFilter" name="movieTitleFilter" placeholder="Enter movie title">
                        </div>
                        <button class="btn-filter" onclick="generateCustomReport()">
                            <i class="fas fa-search"></i> Filter
                        </button>
                        <button class="btn-reset" onclick="resetCustomFilters()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                </div>

                <div>
                    <h5 style="color: var(--text-primary); font-weight: 700; margin-bottom: 15px; font-size: 1.1em;">
                        <i class="fas fa-masks-theater"></i> Filter by Actor
                    </h5>
                    <div class="year-slider-group">
                        <div class="year-input-group">
                            <label for="actorFilter">Actor Name</label>
                            <input type="text" id="actorFilter" name="actorFilter" placeholder="Enter actor name">
                        </div>
                        <div style="opacity: 0; pointer-events: none;">
                            <label>&nbsp;</label>
                            <input type="text" disabled>
                        </div>
                        <button class="btn-filter" onclick="generateActorReport()">
                            <i class="fas fa-search"></i> Filter
                        </button>
                        <button class="btn-reset" onclick="resetActorFilter()">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="statsContainer" class="stats-grid"></div>

        <div id="reportSection" style="display: none;">
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-chart-bar"></i> Report Analytics
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                    <div class="chart-container">
                        <canvas id="directorsChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <canvas id="genresChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">
                    <i class="fas fa-calendar-alt"></i> Movies by Year
                </div>
                <div id="yearTimelineContainer"></div>
            </div>
        </div>

        <div class="section" id="moviesSection" style="display: none;">
            <div class="section-title">
                <i class="fas fa-film"></i> Filtered Movies <span id="movieCount"></span>
            </div>
            <div style="overflow-x: auto;">
                <table class="movies-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Year</th>
                            <th>Director(s)</th>
                            <th>Genre(s)</th>
                        </tr>
                    </thead>
                    <tbody id="moviesTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section" id="directorsSection" style="display: none;">
            <div class="section-title">
                <i class="fas fa-crown"></i> Top Directors
            </div>
            <div class="directors-grid" id="directorsGrid"></div>
        </div>
    </div>

    <script>
        let allYears = [];
        let currentReport = null;
        let directorsChartInstance = null;
        let genresChartInstance = null;

        async function loadYears() {
            try {
                const response = await fetch('/api/years');
                const data = await response.json();
                allYears = data.years;
                
                const minYear = Math.min(...allYears);
                const maxYear = Math.max(...allYears);
                
                document.getElementById('startYear').value = minYear;
                document.getElementById('endYear').value = maxYear;
            } catch (error) {
                console.error('Error loading years:', error);
            }
        }

        async function generateYearReport() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);

            if (!startYear || !endYear) {
                alert('Please enter both start and end years');
                return;
            }

            if (startYear > endYear) {
                alert('Start year cannot be greater than end year');
                return;
            }

            try {
                const response = await fetch(`/api/report/by-year?start_year=${startYear}&end_year=${endYear}`);
                const data = await response.json();
                currentReport = data;

                displayStats(data.statistics);
                displayCharts(data);
                displayMoviesByYear(data.movies_by_year);
                displayTopDirectors(data.statistics.top_directors);
                displayMoviesTable(data.statistics.movies);

                document.getElementById('reportSection').style.display = 'block';
                document.getElementById('moviesSection').style.display = 'block';
                document.getElementById('directorsSection').style.display = 'block';
            } catch (error) {
                console.error('Error generating report:', error);
                alert('Error generating report');
            }
        }

        function displayStats(stats) {
            const container = document.getElementById('statsContainer');
            let fourthStat = '';
            
            if (currentReport.filter.start_year && currentReport.filter.end_year) {
                fourthStat = `
                    <div class="stat-card">
                        <div class="stat-icon">🎞️</div>
                        <div class="stat-label">Years Span</div>
                        <div class="stat-value">${currentReport.filter.start_year}-${currentReport.filter.end_year}</div>
                    </div>
                `;
            } else if (currentReport.filter.director) {
                fourthStat = `
                    <div class="stat-card">
                        <div class="stat-icon">👨‍🎬</div>
                        <div class="stat-label">Director</div>
                        <div class="stat-value" style="font-size: 0.9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${currentReport.filter.director}</div>
                    </div>
                `;
            } else if (currentReport.filter.title) {
                fourthStat = `
                    <div class="stat-card">
                        <div class="stat-icon">🎬</div>
                        <div class="stat-label">Movie</div>
                        <div class="stat-value" style="font-size: 0.9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${currentReport.filter.title}</div>
                    </div>
                `;
            } else if (currentReport.filter.actor) {
                fourthStat = `
                    <div class="stat-card">
                        <div class="stat-icon">🎭</div>
                        <div class="stat-label">Actor</div>
                        <div class="stat-value" style="font-size: 0.9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${currentReport.filter.actor}</div>
                    </div>
                `;
            }
            
            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon">🎬</div>
                    <div class="stat-label">Total Movies</div>
                    <div class="stat-value">${stats.total_movies}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👤</div>
                    <div class="stat-label">Unique Directors</div>
                    <div class="stat-value">${stats.unique_directors}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎭</div>
                    <div class="stat-label">Unique Genres</div>
                    <div class="stat-value">${stats.unique_genres}</div>
                </div>
                ${fourthStat}
            `;
        }

        function displayCharts(data) {
            const stats = data.statistics;
            
            if (directorsChartInstance) {
                directorsChartInstance.destroy();
            }
            if (genresChartInstance) {
                genresChartInstance.destroy();
            }
            
            const topDirectors = stats.top_directors.slice(0, 8);
            const directorNames = topDirectors.map(d => d.name);
            const directorCounts = topDirectors.map(d => d.count);
            
            const topGenres = stats.genres.slice(0, 8);
            const genreNames = topGenres.map(g => g.name);
            const genreCounts = topGenres.map(g => g.count);
            
            directorsChartInstance = new Chart(document.getElementById('directorsChart'), {
                type: 'bar',
                data: {
                    labels: directorNames,
                    datasets: [{
                        label: 'Directors',
                        data: directorCounts,
                        backgroundColor: '#14b8a6',
                        borderColor: '#0f766e',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { 
                        legend: { display: true, labels: { color: '#f1f5f9' } },
                        filler: { propagate: true }
                    },
                    scales: {
                        x: { 
                            stacked: false,
                            ticks: { color: '#cbd5e1' },
                            grid: { color: '#334155' }
                        },
                        y: { 
                            stacked: false,
                            ticks: { color: '#cbd5e1' },
                            grid: { color: '#334155' }
                        }
                    }
                }
            });

            genresChartInstance = new Chart(document.getElementById('genresChart'), {
                type: 'doughnut',
                data: {
                    labels: genreNames,
                    datasets: [{
                        data: genreCounts,
                        backgroundColor: ['#14b8a6', '#0f766e', '#f97316', '#fb923c', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderColor: '#1e293b',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { 
                            position: 'bottom',
                            labels: { color: '#f1f5f9', padding: 15 }
                        } 
                    }
                }
            });
        }

        function displayMoviesByYear(moviesByYear) {
            const container = document.getElementById('yearTimelineContainer');
            let html = '<div class="year-timeline">';
            
            Object.keys(moviesByYear).sort().reverse().forEach(year => {
                const count = moviesByYear[year].length;
                html += `<div class="year-badge">${year}: ${count} movies</div>`;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function displayTopDirectors(topDirectors) {
            const container = document.getElementById('directorsGrid');
            let html = '';
            
            topDirectors.forEach(director => {
                html += `
                    <div class="director-card">
                        <span class="director-name">${director.name}</span>
                        <span class="director-count">${director.count}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function displayMoviesTable(movies) {
            const tbody = document.getElementById('moviesTableBody');
            document.getElementById('movieCount').textContent = `(${movies.length} movies)`;
            
            let html = '';
            movies.forEach(movie => {
                const directors = movie.directors.length > 0 ? movie.directors.join(', ') : 'Unknown';
                const genres = movie.genres.length > 0 ? movie.genres.join(', ') : 'N/A';
                const year = movie.release_year || 'N/A';
                
                html += `
                    <tr>
                        <td><strong>${movie.title}</strong></td>
                        <td>${year}</td>
                        <td>${directors}</td>
                        <td>${genres}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }

        function resetYearFilter() {
            if (allYears.length > 0) {
                const minYear = Math.min(...allYears);
                const maxYear = Math.max(...allYears);
                
                document.getElementById('startYear').value = minYear;
                document.getElementById('endYear').value = maxYear;
            }
            
            document.getElementById('reportSection').style.display = 'none';
            document.getElementById('moviesSection').style.display = 'none';
            document.getElementById('directorsSection').style.display = 'none';
            document.getElementById('statsContainer').innerHTML = '';
        }

        function resetCustomFilters() {
            document.getElementById('directorFilter').value = '';
            document.getElementById('movieTitleFilter').value = '';
            
            document.getElementById('reportSection').style.display = 'none';
            document.getElementById('moviesSection').style.display = 'none';
            document.getElementById('directorsSection').style.display = 'none';
            document.getElementById('statsContainer').innerHTML = '';
        }

        function resetActorFilter() {
            document.getElementById('actorFilter').value = '';
            
            document.getElementById('reportSection').style.display = 'none';
            document.getElementById('moviesSection').style.display = 'none';
            document.getElementById('directorsSection').style.display = 'none';
            document.getElementById('statsContainer').innerHTML = '';
        }

        function resetFilters() {
            resetYearFilter();
            resetCustomFilters();
        }

        async function generateCustomReport() {
            const directorName = document.getElementById('directorFilter').value.trim();
            const movieTitle = document.getElementById('movieTitleFilter').value.trim();

            if (!directorName && !movieTitle) {
                alert('Please enter either a director name or movie title');
                return;
            }

            try {
                let response;
                if (directorName && !movieTitle) {
                    response = await fetch(`/api/report/by-director?director=${encodeURIComponent(directorName)}`);
                } else if (movieTitle && !directorName) {
                    response = await fetch(`/api/report/by-movie-title?title=${encodeURIComponent(movieTitle)}`);
                } else {
                    const directorResponse = await fetch(`/api/report/by-director?director=${encodeURIComponent(directorName)}`);
                    const data = await directorResponse.json();
                    currentReport = data;
                    displayStats(data.statistics);
                    displayCharts(data);
                    displayMoviesByYear(data.movies_by_year);
                    displayTopDirectors(data.statistics.top_directors);
                    displayMoviesTable(data.statistics.movies);
                    document.getElementById('reportSection').style.display = 'block';
                    document.getElementById('moviesSection').style.display = 'block';
                    document.getElementById('directorsSection').style.display = 'block';
                    return;
                }

                const data = await response.json();
                currentReport = data;

                displayStats(data.statistics);
                displayCharts(data);
                displayMoviesByYear(data.movies_by_year);
                displayTopDirectors(data.statistics.top_directors);
                displayMoviesTable(data.statistics.movies);

                document.getElementById('reportSection').style.display = 'block';
                document.getElementById('moviesSection').style.display = 'block';
                document.getElementById('directorsSection').style.display = 'block';
            } catch (error) {
                console.error('Error generating report:', error);
                alert('Error generating report');
            }
        }

        async function generateActorReport() {
            const actorName = document.getElementById('actorFilter').value.trim();

            if (!actorName) {
                alert('Please enter an actor name');
                return;
            }

            try {
                const response = await fetch(`/api/report/by-actor?actor=${encodeURIComponent(actorName)}`);
                const data = await response.json();
                currentReport = data;

                displayStats(data.statistics);
                displayCharts(data);
                displayMoviesByYear(data.movies_by_year);
                displayTopDirectors(data.statistics.top_directors);
                displayMoviesTable(data.statistics.movies);

                document.getElementById('reportSection').style.display = 'block';
                document.getElementById('moviesSection').style.display = 'block';
                document.getElementById('directorsSection').style.display = 'block';
            } catch (error) {
                console.error('Error generating report:', error);
                alert('Error generating report');
            }
        }

        window.addEventListener('load', loadYears);
    </script>
</body>

</html>
